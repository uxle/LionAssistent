[model]
active_model = "gemma-3-1b"
model_path = "models/gemma/"
context_length = 8192
temperature = 0.7
top_p = 0.9
max_tokens = 1024

[ui]
theme = "dark"
language = "en"
# Phase 17 (UI-UX SS13/SS15): reduced_motion / high_contrast / text_scale
# (0.8-2.0). Any value out of range is clamped when applied, not
# rejected -- see config::UiConfig::effective_text_scale.
reduced_motion = false
high_contrast = false
text_scale = 1.0

[performance]
# Phase 18 (Caching/Memory Optimization): tunable cache sizes for
# embeddings::CachingEmbedder and memory::MemoryStore's search-result
# cache. cache_ttl_seconds = 0 means "no expiry" (capacity-based
# eviction only) -- see config::PerformanceConfig::cache_ttl.
embedding_cache_capacity = 256
search_cache_capacity = 64
cache_ttl_seconds = 300

[vision]
# Phase 23 (Vision Support): tesseract language for ocr::extract_text
# (see ocr::validate_language for the accepted shape) and the default
# directory screenshot::capture_full_screen writes captures to.
ocr_language = "eng"
screenshot_dir = "data/screenshots"

enabled_tools = ["system_info", "open_application", "list_directory"]
enabled_plugins = []
logging_level = "info"
