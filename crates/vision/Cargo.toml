[package]
name = "vision"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real image analysis (dimensions, format, color) plus the VisionBackend trait a future local vision-language model plugs into (Development_plan Phase 23 'Image Understanding'; TCLIS SS15 names 'local vision models' explicitly)."

[dependencies]
common = { workspace = true }
tool-framework = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Pinned at the last 0.24.x release: unpinned `image = "0.25"` pulls in
# `moxcms`, which requires the `edition2024` Cargo feature -- not
# supported by this sandbox's Rust 1.75 (the same class of wall
# `workspace.dependencies`' `uuid` pin already documents). Confirmed by
# building both against this exact toolchain: `=0.25.*` fails to
# resolve, `=0.24.9` compiles and decodes real PNG/JPEG data correctly.
# On a modern toolchain (1.85+), remove the pin and `cargo update -p image`.
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
permission-manager = { workspace = true }
