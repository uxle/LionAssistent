[package]
name = "rag"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Document indexing, PDF text extraction, and a local knowledge base with semantic search over both (Development_plan Phase 26 'RAG System'; Archd SS20 names 'Retrieval-Augmented Generation (RAG)' explicitly as a future architecture extension)."

[dependencies]
common = { workspace = true }
tool-framework = { workspace = true }
embeddings = { workspace = true }
vector-db = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# Same pin reasoning as memory's Cargo.toml: rusqlite 0.32+ needs
# rustc 1.77+ (c"..." string literals); 0.31.0 is the newest release
# before that. Removable on a modern toolchain.
rusqlite = { version = "=0.31.0", features = ["bundled"] }
# pdf-extract 0.7+ pulls in a `time` version needing the edition2024
# Cargo feature -- confirmed empirically (0.7.0 through 0.7.4 all fail
# to resolve in this sandbox; 0.6.5 compiles and correctly extracts
# real text from a real, spec-checked PDF). On a modern toolchain this
# pin can likely be relaxed, but re-confirm rather than assume.
pdf-extract = "=0.6.5"

[dev-dependencies]
permission-manager = { workspace = true }
