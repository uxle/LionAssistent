name: ai-assistant
version: '0.1.0'
summary: Local Linux AI Assistant
description: |
  A local-first AI assistant for Linux desktops. Chat interface, safe
  system control through a permission-gated tool layer, local memory,
  and optional voice interaction -- no cloud dependency for the core
  assistant (PRD SS1).

  Voice features (Phase 12) additionally need espeak-ng and pocketsphinx,
  bundled into this snap's own confined environment rather than relying
  on the host having them installed.

# `strict` (Snapcraft's most sandboxed confinement) is the target once
# every interface this app needs (desktop, wayland/x11, audio-playback
# and audio-record for voice, network -- none for the core assistant
# per PRD SS1/SS3, but voice/model-download features may need it) has
# actually been exercised against a real build and found sufficient.
# `devmode` unconfines everything for development and is not a shipping
# configuration; declared explicitly here (rather than left implicit)
# so nobody mistakes this manifest for being ready to publish as-is --
# same "don't overclaim" reasoning this project applies to security
# properties elsewhere (docs/ROADMAP.md, repeatedly).
confinement: devmode
grade: devel
base: core22

apps:
  ai-assistant:
    command: bin/ai-assistant
    extensions: [gnome]
    plugs:
      - home
      - audio-playback
      - audio-record

parts:
  ai-assistant:
    # Packages an already-built release binary, the same pragmatic
    # approach packaging/flatpak/com.lionos.AiAssistant.yml documents at
    # length -- see that file's comment for why building from Rust
    # source inside the part's own build sandbox is a separate,
    # substantial undertaking (dependency vendoring) deliberately out of
    # this phase's scope, and docs/ROADMAP.md's Phase 20 notes for why a
    # real binary doesn't exist yet to package in the first place.
    plugin: dump
    source: ../../target/release/
    organize:
      ai-assistant: bin/ai-assistant
    stage:
      - bin/ai-assistant
  desktop-integration:
    plugin: dump
    source: ../shared/
    organize:
      ai-assistant.desktop: usr/share/applications/ai-assistant.desktop
      com.lionos.AiAssistant.metainfo.xml: usr/share/metainfo/com.lionos.AiAssistant.metainfo.xml
    stage:
      - usr/share/applications/ai-assistant.desktop
      - usr/share/metainfo/com.lionos.AiAssistant.metainfo.xml
  icons:
    plugin: dump
    source: ../../assets/icons/
    organize:
      ai-assistant-16.png: usr/share/icons/hicolor/16x16/apps/ai-assistant.png
      ai-assistant-32.png: usr/share/icons/hicolor/32x32/apps/ai-assistant.png
      ai-assistant-48.png: usr/share/icons/hicolor/48x48/apps/ai-assistant.png
      ai-assistant-64.png: usr/share/icons/hicolor/64x64/apps/ai-assistant.png
      ai-assistant-128.png: usr/share/icons/hicolor/128x128/apps/ai-assistant.png
      ai-assistant-256.png: usr/share/icons/hicolor/256x256/apps/ai-assistant.png
      ai-assistant-512.png: usr/share/icons/hicolor/512x512/apps/ai-assistant.png
    stage:
      - usr/share/icons/hicolor/*/apps/ai-assistant.png
